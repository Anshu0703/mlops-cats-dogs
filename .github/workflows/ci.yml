name: CI - Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model via DVC
        run: |
          pip install dvc
          echo "Model file already committed to Git in models/model.pt — skipping dvc pull"

      - name: Build Docker image
        run: docker build -t cats-dogs-api:${{ github.sha }} .

      - name: Confirm image built
        run: docker images cats-dogs-api